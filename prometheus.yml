global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'swarm-monitor'

rule_files:
  # - "alert.rules"

scrape_configs:
  ######################### PROMETHEUS #########################
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  ######################### NODE-EXPORTER #########################
  - job_name: 'node-exporter'
    dns_sd_configs:
      - names:
          - 'tasks.node-exporter'
        type: 'A'
        port: 9100

  ######################### CADVISOR #########################
  - job_name: 'cadvisor'
    dns_sd_configs:
      - names:
          - 'tasks.cadvisor'
        type: 'A'
        port: 8080