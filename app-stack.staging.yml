version: '3.8'

services:
################################# FRONTEND #################################
  frontend:
    image: ${DOCKER_REGISTRY}/${FRONTEND_IMAGE}:${IMAGE_TAG}
    networks:
      - frontend-net
      - traefik-public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-public"
        - "traefik.http.routers.app.rule=Host(`app.${APP_DOMAIN}`)"
        - "traefik.http.routers.app.entrypoints=websecure"
        - "traefik.http.routers.app.tls.certresolver=letsencrypt"
        - "traefik.http.services.app.loadbalancer.server.port=90"

################################# BACKEND #################################
  backend:
    image: ${DOCKER_REGISTRY}/${BACKEND_IMAGE}:${IMAGE_TAG}
    environment:
      - DATABASE_URL=postgres://${POSTGRESQL_USERNAME}:${POSTGRESQL_PASSWORD}@app_pgpool:5432/${POSTGRESQL_DATABASE}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
    networks:
      - backend-net
      - frontend-net
      - traefik-public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-public"
        - "traefik.http.routers.backend.rule=Host(`backend.${APP_DOMAIN}`)"
        - "traefik.http.routers.backend.entrypoints=websecure"
        - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
        - "traefik.http.services.backend.loadbalancer.server.port=3000"

################################# PGPOOL #################################
  pgpool:
    image: bitnamilegacy/pgpool:latest
    environment:
      - PGPOOL_BACKEND_NODES=0:app_pg-primary:5432,1:app_pg-standby:5432
      - PGPOOL_SR_CHECK_USER=${PGPOOL_SR_CHECK_USER}
      - PGPOOL_SR_CHECK_PASSWORD=${PGPOOL_SR_CHECK_PASSWORD}
      - PGPOOL_ADMIN_USERNAME=${PGPOOL_ADMIN_USERNAME}
      - PGPOOL_ADMIN_PASSWORD=${PGPOOL_ADMIN_PASSWORD}
      - PGPOOL_POSTGRES_USERNAME=postgres
      - PGPOOL_POSTGRES_PASSWORD=${POSTGRESQL_POSTGRES_PASSWORD}
      - POSTGRESQL_USERNAME=${POSTGRESQL_USERNAME}
      - POSTGRESQL_PASSWORD=${POSTGRESQL_PASSWORD}
      - POSTGRESQL_DATABASE=${POSTGRESQL_DATABASE}
    networks:
      - backend-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

################################# PG-PRIMARY #################################
  pg-primary:
    image: alnoda/bitnami-postgresql-repmgr:15.3.0-debian-11-r23
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=${POSTGRESQL_POSTGRES_PASSWORD}
      - POSTGRESQL_USERNAME=${POSTGRESQL_USERNAME}
      - POSTGRESQL_PASSWORD=${POSTGRESQL_PASSWORD}
      - POSTGRESQL_DATABASE=${POSTGRESQL_DATABASE}
      - REPMGR_PASSWORD=${REPMGR_PASSWORD}
      - REPMGR_PRIMARY_HOST=app_pg-primary
      - REPMGR_PARTNER_NODES=app_pg-primary,app_pg-standby
      - REPMGR_NODE_NAME=pg-primary-0
      - REPMGR_NODE_ID=1
      - REPMGR_NODE_NETWORK_NAME=app_pg-primary
    volumes:
      - pg_primary_data:/bitnami/postgresql
    configs:
      - source: db_schema
        target: /docker-entrypoint-initdb.d/schema.sql
    networks:
      - backend-net
    deploy:
      endpoint_mode: dnsrr
      replicas: 1
      placement:
        constraints:
          - node.hostname == swarm-node1
      restart_policy:
        condition: on-failure

################################# PG-STANDBY #################################
  pg-standby:
    image: alnoda/bitnami-postgresql-repmgr:15.3.0-debian-11-r23
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=${POSTGRESQL_POSTGRES_PASSWORD}
      - POSTGRESQL_USERNAME=${POSTGRESQL_USERNAME}
      - POSTGRESQL_PASSWORD=${POSTGRESQL_PASSWORD}
      - POSTGRESQL_DATABASE=${POSTGRESQL_DATABASE}
      - REPMGR_PASSWORD=${REPMGR_PASSWORD}
      - REPMGR_PRIMARY_HOST=app_pg-primary
      - REPMGR_PARTNER_NODES=app_pg-primary,app_pg-standby
      - REPMGR_NODE_NAME=pg-standby-1
      - REPMGR_NODE_ID=2
      - REPMGR_NODE_NETWORK_NAME=app_pg-standby
    volumes:
      - pg_standby_data:/bitnami/postgresql
    networks:
      - backend-net
    deploy:
      endpoint_mode: dnsrr
      replicas: 1
      placement:
        constraints:
          - node.hostname == swarm-node2
      restart_policy:
        condition: on-failure

volumes:
  pg_primary_data:
  pg_standby_data:

networks:
  frontend-net:
    driver: overlay
  backend-net:
    driver: overlay
  traefik-public:
    external: true

configs:
  db_schema:
    file: ./backend/db/schema.sql
